# Build + scan + sign + push images on main, deploy to staging automatically and to production after manual
# approval (GitHub Environment "production" with required reviewers). STATUS: UNVERIFIED — never executed.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/ksp

jobs:
  images:
    name: image ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write          # keyless signing + provenance attestations
      attestations: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, ai-worker, web, backup]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: "${{ env.REGISTRY }}", username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.target }}
          tags: |
            type=sha,format=long
            type=raw,value=staging
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.target }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-${{ matrix.target }}.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: "trivy-${{ matrix.target }}.sarif", category: "trivy-${{ matrix.target }}" }
      - name: SBOM (image, CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_PREFIX }}/${{ matrix.target }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.target }}.cdx.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/${{ matrix.target }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy-staging:
    needs: images
    runs-on: ubuntu-24.04
    environment: staging
    concurrency: deploy-staging
    steps:
      - uses: actions/checkout@v7
      - name: Install kubectl + kustomize
        run: |
          mkdir -p "$HOME/bin" && cd "$HOME/bin"
          curl -fsSL -o kubectl "https://dl.k8s.io/release/v1.30.4/bin/linux/amd64/kubectl" && chmod +x kubectl
          curl -fsSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Kubeconfig
        run: mkdir -p ~/.kube && printf '%s' "$KUBECONFIG_B64" | base64 -d > ~/.kube/config && chmod 600 ~/.kube/config
        env: { KUBECONFIG_B64: "${{ secrets.STAGING_KUBECONFIG_B64 }}" }
      - name: Deploy (migrate job first, then workloads)
        run: scripts/ops/k8s-deploy.sh staging "sha-${GITHUB_SHA}" "${IMAGE_PREFIX}"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-24.04
    environment: production     # required reviewers = manual approval gate
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v7
      - name: Install kubectl + kustomize
        run: |
          mkdir -p "$HOME/bin" && cd "$HOME/bin"
          curl -fsSL -o kubectl "https://dl.k8s.io/release/v1.30.4/bin/linux/amd64/kubectl" && chmod +x kubectl
          curl -fsSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Kubeconfig
        run: mkdir -p ~/.kube && printf '%s' "$KUBECONFIG_B64" | base64 -d > ~/.kube/config && chmod 600 ~/.kube/config
        env: { KUBECONFIG_B64: "${{ secrets.PRODUCTION_KUBECONFIG_B64 }}" }
      - name: Deploy (migrate job first, then workloads)
        run: scripts/ops/k8s-deploy.sh production "sha-${GITHUB_SHA}" "${IMAGE_PREFIX}"
