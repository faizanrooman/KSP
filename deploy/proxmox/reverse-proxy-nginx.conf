# Reverse proxy in front of the KSP VMS web tier (container port 8080). Drop into /etc/nginx/conf.d/ksp.conf on the
# reverse-proxy container/VM and replace ksp.lan + the upstream address. TLS is REQUIRED: the application sets secure
# cookies and refuses non-https base URLs; a self-signed or internal-CA certificate is fine for a LAN demo.
#   openssl req -x509 -newkey rsa:2048 -nodes -days 825 -keyout /etc/nginx/ksp.key -out /etc/nginx/ksp.crt -subj "/CN=ksp.lan"

upstream ksp_web { server 192.168.1.60:8080; keepalive 32; }   # <- container IP printed by pve-create-lxc.sh

server {
  listen 80;
  server_name ksp.lan;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name ksp.lan;

  ssl_certificate     /etc/nginx/ksp.crt;
  ssl_certificate_key /etc/nginx/ksp.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  # evidence uploads are chunked (16 MiB parts) but allow large bodies and long streams
  client_max_body_size 64m;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_request_buffering off;
  proxy_buffering off;              # media streaming with Range requests

  location / {
    proxy_pass http://ksp_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # audit trail client IPs (TRUST_PROXY=true)
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
  }
}
