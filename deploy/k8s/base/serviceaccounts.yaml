# One service account per workload; none of them needs the Kubernetes API, so tokens are not mounted.
apiVersion: v1
kind: ServiceAccount
metadata: { name: ksp-api }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: ksp-worker }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: ksp-ai-worker }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: ksp-web }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: ksp-migrate }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: ksp-backup }
automountServiceAccountToken: false
