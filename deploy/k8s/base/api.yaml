apiVersion: apps/v1
kind: Deployment
metadata:
  name: ksp-api
  labels: { app.kubernetes.io/name: ksp-api, app.kubernetes.io/component: api }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: ksp-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ksp-api, app.kubernetes.io/component: api, ksp.police/db-client: "true", ksp.police/s3-client: "true" }
    spec:
      serviceAccountName: ksp-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: ksp-api } }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: { matchLabels: { app.kubernetes.io/name: ksp-api } }
      containers:
        - name: api
          image: ksp/api
          imagePullPolicy: IfNotPresent
          command: ["node", "apps/api/dist/server.js"]
          ports:
            - { name: http, containerPort: 4000 }
            - { name: metrics, containerPort: 9464 }
          envFrom:
            - configMapRef: { name: ksp-config }
            - secretRef: { name: ksp-app }
          env:
            - { name: KSP_SERVICE, value: ksp-api }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            # Let the ingress/endpoint controllers drop this pod before SIGTERM closes the listener.
            preStop: { sleep: { seconds: 10 } }
          volumeMounts:
            - { name: secrets, mountPath: /run/secrets/ksp, readOnly: true }
            - { name: work, mountPath: /work }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: secrets
          secret:
            secretName: ksp-app
            defaultMode: 0400
            items:
              - { key: jwt_private_key, path: jwt_private_key }
              - { key: jwt_public_key, path: jwt_public_key }
              - { key: signing_private_key, path: signing_private_key }
              - { key: signing_certificate, path: signing_certificate }
        - name: work
          emptyDir: { sizeLimit: 2Gi }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ksp-api
  labels: { app.kubernetes.io/name: ksp-api }
spec:
  selector: { app.kubernetes.io/name: ksp-api }
  ports:
    - { name: http, port: 4000, targetPort: http }
    - { name: metrics, port: 9464, targetPort: metrics }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: ksp-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ksp-api }
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: ksp-api }
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: ksp-api } }
