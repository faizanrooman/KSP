apiVersion: apps/v1
kind: Deployment
metadata:
  name: ksp-web
  labels: { app.kubernetes.io/name: ksp-web, app.kubernetes.io/component: web }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: ksp-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ksp-web, app.kubernetes.io/component: web }
    spec:
      serviceAccountName: ksp-web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10101
        runAsGroup: 10101
        fsGroup: 10101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ksp/web
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: API_UPSTREAM_HOSTPORT, value: "ksp-api:4000" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          volumeMounts:
            # The nginx entrypoint renders the config template into conf.d; nginx needs writable cache/tmp.
            - { name: confd, mountPath: /etc/nginx/conf.d }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: confd, emptyDir: { sizeLimit: 1Mi } }
        - { name: cache, emptyDir: { sizeLimit: 256Mi } }
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: ksp-web
  labels: { app.kubernetes.io/name: ksp-web }
spec:
  selector: { app.kubernetes.io/name: ksp-web }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: ksp-web }
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: ksp-web } }
