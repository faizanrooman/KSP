# Isolated AI worker: DB role ksp_ai + derived-bucket-only S3 identity; network egress only to DB and S3.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: ksp-ai-models }
spec:
  accessModes: [ReadWriteMany]   # written once by the models Job, mounted read-only by every AI worker
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ksp-ai-worker
  labels: { app.kubernetes.io/name: ksp-ai-worker, app.kubernetes.io/component: ai-worker }
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: ksp-ai-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ksp-ai-worker, app.kubernetes.io/component: ai-worker, ksp.police/db-client: "true", ksp.police/s3-client: "true" }
    spec:
      serviceAccountName: ksp-ai-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Refuse to start unless every model file matches its pinned SHA-256 (never downloads; no egress anyway).
        - name: verify-models
          image: ksp/ai-worker
          command: ["node", "scripts/ops/fetch-models.mjs", "--verify-only"]
          envFrom:
            - configMapRef: { name: ksp-ai-config }
          env: &aienv
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: ksp-ai, key: DATABASE_AI_URL } }
            - name: DATABASE_AI_URL
              valueFrom: { secretKeyRef: { name: ksp-ai, key: DATABASE_AI_URL } }
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: ksp-ai, key: S3_AI_ACCESS_KEY } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: ksp-ai, key: S3_AI_SECRET_KEY } }
            - name: S3_AI_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: ksp-ai, key: S3_AI_ACCESS_KEY } }
            - name: S3_AI_SECRET_KEY
              valueFrom: { secretKeyRef: { name: ksp-ai, key: S3_AI_SECRET_KEY } }
            - { name: KSP_SERVICE, value: ksp-ai-worker }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
      containers:
        - name: ai-worker
          image: ksp/ai-worker
          command: ["node", "apps/ai-worker/dist/main.js"]
          envFrom:
            - configMapRef: { name: ksp-ai-config }
          env: *aienv
          resources:
            requests: { cpu: "2", memory: 2Gi }
            limits: { cpu: "4", memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          # No HTTP surface by design: liveness = the process is running (it exits non-zero on fatal errors).
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
            - { name: work, mountPath: /work }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: ksp-ai-models, readOnly: true }
        - name: work
          emptyDir: { sizeLimit: 10Gi }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: ksp-ai-worker }
spec:
  maxUnavailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: ksp-ai-worker } }
