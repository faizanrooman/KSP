# Backups (docs/BACKUP-RESTORE-RUNBOOK.md). All run the ksp/backup image (pg 16 client + node + age), non-root.
#   ksp-pg-backup        nightly encrypted pg_dump -> backup bucket at the DR site (Object Lock)
#   ksp-backup-verify    weekly: restore the latest dump into a scratch database and verify ledger + migrations
#   ksp-s3-replicate     hourly: evidence/derived/exports/reports -> DR object store, SHA-256 vs DB for originals
# PITR (continuous WAL archiving + base backups) is provided by CloudNativePG/barman (components/cloudnative-pg).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ksp-pg-backup
  labels: { app.kubernetes.io/name: ksp-backup }
spec:
  schedule: "30 20 * * *"            # 02:00 IST
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 21600
      template:
        metadata:
          labels: { app.kubernetes.io/name: ksp-backup, ksp.police/db-client: "true" }
        spec:
          serviceAccountName: ksp-backup
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext: &sc
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: pg-backup
              image: ksp/backup
              command: ["scripts/backup/pg-backup.sh"]
              envFrom:
                - configMapRef: { name: ksp-backup-config }
                - secretRef: { name: ksp-backup }
              env:
                - { name: BACKUP_WORK_DIR, value: /work }
              resources:
                requests: { cpu: 500m, memory: 512Mi }
                limits: { cpu: "2", memory: 2Gi }
              securityContext: &csc
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: work, mountPath: /work }
                - { name: tmp, mountPath: /tmp }
                - { name: recipients, mountPath: /run/secrets/ksp-backup, readOnly: true }
          volumes:
            # Must hold the dump + its ciphertext (~2x compressed DB size). Use a generic ephemeral volume at scale.
            - name: work
              ephemeral:
                volumeClaimTemplate:
                  spec:
                    accessModes: [ReadWriteOnce]
                    resources: { requests: { storage: 200Gi } }
            - name: tmp
              emptyDir: { sizeLimit: 256Mi }
            - name: recipients
              secret:
                secretName: ksp-backup
                defaultMode: 0440
                items: [{ key: backup_age_recipients, path: backup_age_recipients }]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ksp-backup-verify
  labels: { app.kubernetes.io/name: ksp-backup }
spec:
  schedule: "30 23 * * 0"            # Monday 05:00 IST
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 4
  jobTemplate:
    spec:
      backoffLimit: 0                 # a failed verification must page, not silently retry
      activeDeadlineSeconds: 43200
      template:
        metadata:
          labels: { app.kubernetes.io/name: ksp-backup, ksp.police/db-client: "true" }
        spec:
          serviceAccountName: ksp-backup
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext: *sc
          containers:
            - name: verify
              image: ksp/backup
              command: ["scripts/backup/verify-backup.sh", "latest"]
              envFrom:
                - configMapRef: { name: ksp-backup-config }
                - secretRef: { name: ksp-backup }
              env:
                - { name: BACKUP_WORK_DIR, value: /work }
                - { name: BACKUP_AGE_IDENTITY_FILE, value: /run/secrets/ksp-backup-identity/backup_age_identity }
                # Scratch PostgreSQL (separate instance, e.g. CloudNativePG cluster "ksp-verify"); never the primary.
                - name: VERIFY_ADMIN_URL
                  valueFrom: { secretKeyRef: { name: ksp-backup-verify, key: VERIFY_ADMIN_URL } }
              resources:
                requests: { cpu: "1", memory: 1Gi }
                limits: { cpu: "4", memory: 4Gi }
              securityContext: *csc
              volumeMounts:
                - { name: work, mountPath: /work }
                - { name: tmp, mountPath: /tmp }
                - { name: identity, mountPath: /run/secrets/ksp-backup-identity, readOnly: true }
          volumes:
            - name: work
              ephemeral:
                volumeClaimTemplate:
                  spec:
                    accessModes: [ReadWriteOnce]
                    resources: { requests: { storage: 200Gi } }
            - name: tmp
              emptyDir: { sizeLimit: 256Mi }
            # The age IDENTITY is only in this Secret (ksp-backup-verify), readable by this job alone.
            - name: identity
              secret:
                secretName: ksp-backup-verify
                defaultMode: 0440
                items: [{ key: backup_age_identity, path: backup_age_identity }]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ksp-s3-replicate
  labels: { app.kubernetes.io/name: ksp-backup }
spec:
  schedule: "15 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      template:
        metadata:
          labels: { app.kubernetes.io/name: ksp-backup, ksp.police/db-client: "true", ksp.police/s3-client: "true" }
        spec:
          serviceAccountName: ksp-backup
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext: *sc
          containers:
            - name: replicate
              image: ksp/backup
              command: ["node", "scripts/backup/s3-replicate.ts", "--concurrency", "8"]
              envFrom:
                - configMapRef: { name: ksp-config }
                - configMapRef: { name: ksp-backup-config }
                - secretRef: { name: ksp-replicate }
              resources:
                requests: { cpu: 500m, memory: 512Mi }
                limits: { cpu: "2", memory: 2Gi }
              securityContext: *csc
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: tmp
              emptyDir: { sizeLimit: 256Mi }
