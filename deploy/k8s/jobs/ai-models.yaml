# One-shot: download + SHA-256-verify the pinned models and register them (app role, has internet egress).
# Re-run after upgrading the model manifest: kubectl -n ksp-vms delete job ksp-ai-models --ignore-not-found && apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: ksp-ai-models
  labels: { app.kubernetes.io/name: ksp-ai-models }
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: ksp-ai-models, ksp.police/db-client: "true", ksp.police/model-download: "true" }
    spec:
      serviceAccountName: ksp-migrate
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: fetch-models
          image: ksp/ai-worker
          command: ["node", "scripts/ops/fetch-models.mjs"]
          envFrom:
            - configMapRef: { name: ksp-config }
            - secretRef: { name: ksp-app }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: secrets, mountPath: /run/secrets/ksp, readOnly: true }
            - { name: models, mountPath: /models }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: secrets
          secret:
            secretName: ksp-app
            defaultMode: 0400
            items:
              - { key: jwt_private_key, path: jwt_private_key }
              - { key: jwt_public_key, path: jwt_public_key }
              - { key: signing_private_key, path: signing_private_key }
              - { key: signing_certificate, path: signing_certificate }
        - name: models
          persistentVolumeClaim: { claimName: ksp-ai-models }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
