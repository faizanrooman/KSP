# Each Secret is assembled from keys under ksp/<env>/… in the secrets manager (paths patched per overlay).
# Key names match scripts/ops/generate-secrets.sh output so the generated set can be imported 1:1.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: ksp-app }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: ksp-secrets }
  target:
    name: ksp-app
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://ksp_app:{{ .ksp_app_db_password }}@ksp-db-rw:5432/ksp?sslmode=require"
        S3_ACCESS_KEY: "{{ .s3_access_key }}"
        S3_SECRET_KEY: "{{ .s3_secret_key }}"
        DATA_ENCRYPTION_KEY: "{{ .data_encryption_key }}"
        MEDIA_TOKEN_SECRET: "{{ .media_token_secret }}"
        SIGNING_KEY_ID: "{{ .signing_key_id }}"
        jwt_private_key: "{{ .jwt_private_key }}"
        jwt_public_key: "{{ .jwt_public_key }}"
        signing_private_key: "{{ .signing_private_key }}"
        signing_certificate: "{{ .signing_certificate }}"
  dataFrom:
    - extract: { key: ksp/production/app }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: ksp-migrate }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: ksp-secrets }
  target:
    name: ksp-migrate
    template:
      engineVersion: v2
      data:
        DATABASE_MIGRATION_URL: "postgres://ksp_owner:{{ .ksp_owner_db_password }}@ksp-db-rw:5432/ksp?sslmode=require"
  dataFrom:
    - extract: { key: ksp/production/migrate }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: ksp-ai }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: ksp-secrets }
  target:
    name: ksp-ai
    template:
      engineVersion: v2
      data:
        DATABASE_AI_URL: "postgres://ksp_ai:{{ .ksp_ai_db_password }}@ksp-db-rw:5432/ksp?sslmode=require"
        S3_AI_ACCESS_KEY: "{{ .s3_ai_access_key }}"
        S3_AI_SECRET_KEY: "{{ .s3_ai_secret_key }}"
  dataFrom:
    - extract: { key: ksp/production/ai }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: ksp-backup }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: ksp-secrets }
  target:
    name: ksp-backup
    template:
      engineVersion: v2
      data:
        PGPASSWORD: "{{ .ksp_backup_db_password }}"
        BACKUP_RECORD_URL: "postgres://ksp_app:{{ .ksp_app_db_password }}@ksp-db-rw:5432/ksp?sslmode=require"
        BACKUP_S3_ACCESS_KEY: "{{ .backup_s3_access_key }}"
        BACKUP_S3_SECRET_KEY: "{{ .backup_s3_secret_key }}"
        backup_age_recipients: "{{ .backup_age_recipients }}"
        backup_signing_key: "{{ .backup_signing_key }}"
        backup_signing_pubkey: "{{ .backup_signing_pubkey }}"
  dataFrom:
    - extract: { key: ksp/production/backup }
---
# Restore-verification job only: the age IDENTITY (decryption key) + the scratch cluster admin URL.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: ksp-backup-verify }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: ksp-secrets }
  target:
    name: ksp-backup-verify
  dataFrom:
    - extract: { key: ksp/production/backup-verify }   # keys: VERIFY_ADMIN_URL, backup_age_identity, backup_signing_pubkey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: ksp-replicate }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: ksp-secrets }
  target:
    name: ksp-replicate
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://ksp_app:{{ .ksp_app_db_password }}@ksp-db-r:5432/ksp?sslmode=require"
        BACKUP_RECORD_URL: "postgres://ksp_app:{{ .ksp_app_db_password }}@ksp-db-rw:5432/ksp?sslmode=require"
        S3_ACCESS_KEY: "{{ .s3_replica_read_access_key }}"
        S3_SECRET_KEY: "{{ .s3_replica_read_secret_key }}"
        DR_S3_ACCESS_KEY: "{{ .dr_s3_access_key }}"
        DR_S3_SECRET_KEY: "{{ .dr_s3_secret_key }}"
  dataFrom:
    - extract: { key: ksp/production/replicate }
