# Prometheus scrape config for the compose deployment (Kubernetes uses deploy/k8s/base/servicemonitor.yaml).
# The metrics ports are internal only (monitoring network); they are never routed through the web tier.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels: { deployment: ksp-vms }

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

scrape_configs:
  - job_name: ksp-api
    dns_sd_configs: [{ names: ["api"], type: A, port: 9464 }]
  - job_name: ksp-worker
    dns_sd_configs: [{ names: ["worker"], type: A, port: 9465 }]
  # AI worker (METRICS_PORT + 2); it joins only the internal `ai` and `monitoring` networks.
  - job_name: ksp-ai-worker
    dns_sd_configs: [{ names: ["ai-worker"], type: A, port: 9466 }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
