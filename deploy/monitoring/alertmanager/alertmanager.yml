# Alertmanager routing. Replace the receiver with the KSP NOC channel (e-mail relay / webhook / SMS gateway).
route:
  receiver: noc
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: noc
      repeat_interval: 30m

receivers:
  - name: noc
    webhook_configs:
      # Internal webhook relay (e.g. to the NOC paging system). Must be reachable on the monitoring network.
      - url: http://alert-relay.monitoring.svc:8080/alerts
        send_resolved: true

inhibit_rules:
  - source_matchers: [alertname="KspApiNoHealthyInstances"]
    target_matchers: [alertname=~"KspApiDown|KspApiHighErrorRate|KspApiHighLatency"]
